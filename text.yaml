Camera:
  exposure_armor: 2500 
  exposure_buff: 2000 
  camera_matrix: [2374.583734143874, 0, 700.7026376077414, 0, 2357.597221612343, 525.4234008238891, 0, 0, 1]
  distort_coeffs: [-0.0196, 0.124545410117226, 0, 0, 0]
  show: 1

USBCamera:
  usb_frame_rate: 120
  new_usb_exposure: 150 

Transform:
  R_camera2gimbal: [0, 0, 1, -1, 0, 0, 0, -1, 0]
  t_camera2gimbal: [-0.05, -0.05, 0]

Planer:
  max_yaw_acc: 100

EKF:
  ProcessNoise:
    dd: 100
    da: 400

# B auto_aim_sentry tracking/model/aimer with A detector, calibration and hardware interfaces.
Sentry:
  min_detect_count: 5
  max_temp_lost_count: 15
  outpost_max_temp_lost_count: 75
  max_frame_gap: 0.1             # seconds; reset after camera interruption
  max_distance: 12              # metres
  coming_angle: 70              # degrees
  leaving_angle: 20             # degrees
  min_spin_speed: 2             # rad/s
  first_tolerance: 1.5          # degrees, preserves A's firing tolerance
  second_tolerance: 1.5
  judge_distance: 2             # metres
  auto_fire: true
  priority_ids: [1, 3, 4, 7, 6, 8, 2, 5]  # A IDs; 6=outpost, 7=guard, 8=base

Transmit:
  compensate_pitch: 0.8 # 朝上为正
  compensate_yaw: 0.4  # 朝左为正
  predict_time: 0.07
 
Buff:
  compensate_pitch: 1.25 # 向上为正
  compensate_yaw: 0.7  # 向左为正
  predict_time: 0.05

